<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GARDA KARSA - Portal Pemuda & Warga</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-20">

  <!-- Header / Navbar -->
  <header class="bg-indigo-900 text-white p-4 shadow-md sticky top-0 z-40">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="font-bold text-lg tracking-wide">GARDA KARSA</h1>
      <button onclick="bukaAdminModal()" class="text-xs bg-indigo-700 hover:bg-indigo-600 px-3 py-1.5 rounded-lg transition">
        🔐 Admin
      </button>
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="max-w-md mx-auto p-4 space-y-6">
    
    <!-- Section Acara & Notulen -->
    <section>
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold text-gray-700 text-base">📅 Jadwal Acara & Notulen</h2>
      </div>
      <!-- Container Daftar Acara (Dimuat otomatis lewat JavaScript) -->
      <div id="listAcara" class="space-y-3">
        <p class="text-sm text-gray-400 text-center py-4">Memuat data acara...</p>
      </div>
    </section>

  </main>

  <!-- ================= MODAL DETAIL ACARA & NOTULEN ================= -->
  <div id="modalAcara" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl relative max-h-[90vh] overflow-y-auto">
      
      <!-- Tombol Tutup -->
      <button onclick="tutupModalAcara()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold text-xl">
        &times;
      </button>

      <!-- Judul & Tanggal -->
      <h3 id="modalJudul" class="text-xl font-bold text-indigo-900 pr-6"></h3>
      <div class="flex items-center gap-4 text-sm text-gray-500 mt-2 mb-4 border-b pb-3">
        <span>📅 <span id="modalTanggal"></span></span>
        <span>📍 <span id="modalLokasi"></span></span>
      </div>

      <!-- Deskripsi Acara -->
      <div class="mb-5">
        <h4 class="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Deskripsi Kegiatan</h4>
        <p id="modalDeskripsi" class="text-gray-700 text-sm leading-relaxed whitespace-pre-line"></p>
      </div>

      <!-- Bagian Notulen Rapat -->
      <div class="bg-indigo-50/60 rounded-xl p-4 border border-indigo-100">
        <div class="flex items-center gap-2 mb-2">
          <span class="text-indigo-600 font-bold">📝 Notulen Rapat & Hasil Keputusan</span>
        </div>
        <div id="modalNotulen" class="text-sm text-gray-800 whitespace-pre-line leading-relaxed">
          <span class="italic text-gray-400">Belum ada notulen untuk acara ini.</span>
        </div>
      </div>

    </div>
  </div>

  <!-- ================= MODAL ADMIN: TAMBAH ACARA & NOTULEN ================= -->
  <div id="modalAdmin" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl relative">
      <h3 class="text-lg font-bold text-indigo-900 mb-4">Panel Admin: Tambah Acara</h3>
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Acara</label>
          <input type="text" id="inputNamaAcara" class="w-full border rounded-lg p-2 text-sm" placeholder="Contoh: Rapat Pleno Bulanan">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Tanggal</label>
          <input type="text" id="inputTanggalAcara" class="w-full border rounded-lg p-2 text-sm" placeholder="Contoh: 10 November 2026">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Lokasi</label>
          <input type="text" id="inputLokasiAcara" class="w-full border rounded-lg p-2 text-sm" placeholder="Contoh: Balai Desa Prigi">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Deskripsi Lengkap</label>
          <textarea id="inputDeskripsiAcara" rows="2" class="w-full border rounded-lg p-2 text-sm" placeholder="Rincian kegiatan..."></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Notulen Rapat / Hasil (Opsional)</label>
          <textarea id="inputNotulenAcara" rows="3" class="w-full border rounded-lg p-2 text-sm" placeholder="Tuliskan hasil keputusan rapat di sini..."></textarea>
        </div>
      </div>

      <div class="flex justify-end gap-2 mt-5">
        <button onclick="tutupAdminModal()" class="px-4 py-2 text-sm text-gray-600 bg-gray-100 rounded-lg">Batal</button>
        <button onclick="simpanAcara()" class="px-4 py-2 text-sm text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg font-medium">Simpan</button>
      </div>
    </div>
  </div>

  <!-- ================= JAVASCRIPT LOGIC ================= -->
  <script>
    // URL Web App Google Apps Script Anda yang baru
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxartaShYX1bZZW1-V6i_Wx7CR8BKzfwbwZ6ws4pWTOEY_MLbc4QGG40SJ1aJhv_r0hGg/exec";

    // Fungsi memuat data Acara saat halaman dibuka
    function muatDataAcara() {
      fetch(WEB_APP_URL + '?action=getAcara')
        .then(res => res.json())
        .then(data => {
          const container = document.getElementById('listAcara');
          container.innerHTML = '';
          
          if (!data || data.length === 0) {
            container.innerHTML = '<p class="text-sm text-gray-400 text-center py-4">Belum ada jadwal acara.</p>';
            return;
          }

          data.forEach(item => {
            // Escape string kutipan agar aman di atribut onclick
            const nama = (item.nama_acara || '').replace(/'/g, "\\'");
            const tgl = (item.tanggal || '').replace(/'/g, "\\'");
            const lok = (item.lokasi || '').replace(/'/g, "\\'");
            const desc = (item.deskripsi_lengkap || '').replace(/'/g, "\\'").replace(/\n/g, '\\n');
            const notul = (item.notulen || '').replace(/'/g, "\\'").replace(/\n/g, '\\n');

            container.innerHTML += `
              <div onclick="bukaDetailAcara('${nama}', '${tgl}', '${lok}', '${desc}', '${notul}')" 
                   class="cursor-pointer p-4 bg-white rounded-xl shadow-sm hover:shadow-md border border-gray-100 transition">
                <h4 class="font-bold text-gray-800">${item.nama_acara}</h4>
                <p class="text-xs text-gray-500 mt-1">📅 ${item.tanggal} | 📍 ${item.lokasi}</p>
                <div class="mt-2 flex items-center justify-between">
                  <span class="text-xs text-indigo-600 font-medium">Ketuk untuk lihat detail & notulen →</span>
                  ${item.notulen ? '<span class="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-semibold">📝 Ada Notulen</span>' : ''}
                </div>
              </div>
            `;
          });
        })
        .catch(err => {
          console.error('Gagal memuat data:', err);
          document.getElementById('listAcara').innerHTML = '<p class="text-sm text-red-400 text-center py-4">Gagal memuat data acara.</p>';
        });
    }

    // Fungsi Membuka Modal Detail Acara & Notulen
    function bukaDetailAcara(nama, tanggal, lokasi, deskripsi, notulen) {
      document.getElementById('modalJudul').innerText = nama;
      document.getElementById('modalTanggal').innerText = tanggal;
      document.getElementById('modalLokasi').innerText = lokasi;
      document.getElementById('modalDeskripsi').innerText = deskripsi && deskripsi !== 'undefined' ? deskripsi : 'Tidak ada deskripsi tambahan.';
      
      const containerNotulen = document.getElementById('modalNotulen');
      if (notulen && notulen.trim() !== "" && notulen !== 'undefined') {
        containerNotulen.innerHTML = notulen.replace(/\\n/g, '<br>');
      } else {
        containerNotulen.innerHTML = '<span class="italic text-gray-400">Notulen belum diunggah oleh pengurus. Warga dapat membaca rangkuman setelah rapat selesai.</span>';
      }

      const modal = document.getElementById('modalAcara');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function tutupModalAcara() {
      const modal = document.getElementById('modalAcara');
      modal.classList.remove('flex');
      modal.classList.add('hidden');
    }

    // Fungsi Panel Admin
    function bukaAdminModal() {
      // Anda bisa menambahkan verifikasi PIN sederhana di sini jika diinginkan
      document.getElementById('modalAdmin').classList.remove('hidden');
      document.getElementById('modalAdmin').classList.add('flex');
    }

    function tutupAdminModal() {
      document.getElementById('modalAdmin').classList.remove('flex');
      document.getElementById('modalAdmin').classList.add('hidden');
    }

    function simpanAcara() {
      const data = {
        id: Date.now().toString(),
        nama_acara: document.getElementById('inputNamaAcara').value,
        tanggal: document.getElementById('inputTanggalAcara').value,
        lokasi: document.getElementById('inputLokasiAcara').value,
        deskripsi_lengkap: document.getElementById('inputDeskripsiAcara').value,
        notulen: document.getElementById('inputNotulenAcara').value
      };

      if(!data.nama_acara || !data.tanggal) {
        alert('Nama acara dan tanggal wajib diisi!');
        return;
      }

      fetch(WEB_APP_URL + '?action=addAcara', {
        method: 'POST',
        body: JSON.stringify(data)
      })
      .then(res => res.text())
      .then(response => {
        alert('Acara & Notulen berhasil disimpan!');
        tutupAdminModal();
        muatDataAcara(); // Refresh otomatis daftar acara
      })
      .catch(err => {
        alert('Gagal menyimpan data.');
        console.error(err);
      });
    }

    // Jalankan saat pertama kali dibuka
    window.onload = function() {
      muatDataAcara();
    };
  </script>
</body>
</html>
